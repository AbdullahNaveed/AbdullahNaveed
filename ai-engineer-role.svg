<svg xmlns="http://www.w3.org/2000/svg" width="300" height="46" viewBox="0 0 300 46" role="img" aria-labelledby="role">
  <title id="role">AI Engineer</title>
  <style>
    text { fill: #5145a7; }
    .track { stroke: #8271d4; }
    .trace { stroke: #6853ce; animation: reveal 1000ms cubic-bezier(.2,.7,.25,1) both; }
    @keyframes reveal { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-color-scheme: dark) {
      text { fill: #c3b5ff; }
      .track { stroke: #9c86fc; }
      .trace { stroke: #baabff; }
    }
    @media (prefers-reduced-motion: reduce) { .trace { animation: none; } }
  </style>
  <text x="150" y="24" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-weight="600" font-size="18" letter-spacing="2">AI ENGINEER</text>
  <path class="track" d="M125 36h50" stroke-width="2" stroke-linecap="round" opacity=".24"/>
  <path class="trace" d="M125 36h50" pathLength="100" stroke-width="2" stroke-linecap="round" stroke-dasharray="100"/>
</svg>
