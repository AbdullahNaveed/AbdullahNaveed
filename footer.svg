<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="160" viewBox="0 0 1280 160" role="img"><style>.move{animation:move 6s ease-in-out infinite}.delay{animation-delay:-3s}@keyframes move{50%{transform:translateY(-9px)}}.flow{stroke-dasharray:6 14;animation:flow 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.move,.flow{animation:none}}</style><rect width="1280" height="160" rx="16" fill="#0b111c"/><title>From models to useful products</title><path d="M35 25H1245" stroke="#29434e"/><path d="M35 25H1245" stroke="#69d9c6" class="flow" opacity=".5"/><text x="640" y="87" text-anchor="middle" fill="#dce9ed" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Good models are a start. Useful products are the goal.</text><text x="640" y="121" text-anchor="middle" fill="#7e96aa" font-family="monospace" font-size="13" letter-spacing="3">BUILD / EXPERIMENT / SHARE / REPEAT</text></svg>